# ── SanchaySaathi — Docker Compose ────────────────────────────────────────────
# Local development and production-equivalent stack
#
# Usage:
#   Start all services:      docker compose up -d
#   Watch logs:              docker compose logs -f
#   Stop all services:       docker compose down
#   Rebuild images:          docker compose up -d --build
#   Reset (deletes DB):      docker compose down -v   ⚠️  WARNING: deletes database volume
#   Check container status:  docker compose ps
#
# Services:
#   db-init    — one-shot schema migration, runs then exits
#   backend    — FastAPI on port 8000
#   frontend   — React/Nginx on port 80
#
# Access:
#   React frontend:  http://localhost:80
#   API Docs:        http://localhost:8000/docs
#   Health:          http://localhost:8000/health
#
# Streamlit still available during migration:
#   uv run streamlit run frontend/app.py --server.port 8501

services:

  # ── Schema Migration (one-shot, runs then exits) ───────────────────────────
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uv", "run", "python", "migrate_schema.py"]
    env_file: .env
    volumes:
      - spendsense_data:/app/data
      - ./migrate_schema.py:/app/migrate_schema.py:ro
    restart: "no"

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - spendsense_data:/app/data
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── React/Nginx Frontend ───────────────────────────────────────────────────
  # T2.10: replaced Streamlit (port 8501) with React+Nginx (port 80)
  # Streamlit can still be run manually: uv run streamlit run frontend/app.py
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Pass backend URL into Vite build — baked into the JS bundle
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  spendsense_data:
    driver: local
