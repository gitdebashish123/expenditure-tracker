# nginx/react.conf
# Serves the SanchaySaathi React (Vite) build.
#
# Key requirement: React Router uses client-side routing.
# Without try_files, refreshing /account or /fixed returns 404 from Nginx
# because those paths don't exist as files — React Router handles them.

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # ── React Router support ──────────────────────────────────────────────
    # For any path that isn't a real file, serve index.html.
    # React Router then takes over and renders the correct component.
    location / {
        try_files $uri $uri/ /index.html;
    }


    # ── Static asset caching ──────────────────────────────────────────────
    # Vite hashes filenames (e.g. main.a1b2c3.js) so 1-year cache is safe.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "strict-origin-when-cross-origin";

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;
    gzip_min_length 1024;
}
