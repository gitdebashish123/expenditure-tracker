# =============================================================================
# SpendSense — nginx Reverse Proxy Config: Streamlit Frontend
# Commit 1.2: HTTPS Local Setup
#
# PURPOSE : Local development HTTPS only — NOT for production use.
#           Production HTTPS is handled automatically by Railway / Render.
#
# PROXIES : https://localhost:8443  →  http://127.0.0.1:8501 (Streamlit)
#
# CRITICAL: WebSocket headers are required for Streamlit to function correctly.
#           Without them, the page loads but widgets stop responding and the
#           app appears frozen (Streamlit uses WebSockets for live updates).
#
# USAGE   :
#   Load:   nginx -c /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/spendsense-frontend.conf
#   Reload: nginx -s reload
#   Stop:   nginx -s stop
# =============================================================================

# Required — tells nginx where to write its pid file when using a custom config
pid /tmp/nginx-spendsense-frontend.pid;

events {
    worker_connections 64;
}

http {

    server {
        listen      8443 ssl;
        server_name localhost;

        # ── TLS Certificate ─────────────────────────────────────────────────
        ssl_certificate     /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/certs/spendsense.crt;
        ssl_certificate_key /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/certs/spendsense.key;

        # ── TLS Hardening ────────────────────────────────────────────────────
        # Only allow TLSv1.2 and TLSv1.3 — older versions (1.0, 1.1) are insecure
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suite — excludes anonymous (aNULL) and MD5-based ciphers
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── Proxy to Streamlit ───────────────────────────────────────────────
        location / {
            proxy_pass http://127.0.0.1:8501;

            # ── WebSocket Support (NON-NEGOTIABLE for Streamlit) ─────────────
            # Streamlit uses WebSockets to push live updates to the browser.
            # These three headers upgrade the HTTP connection to WebSocket.
            # Removing any of these will cause the UI to freeze silently.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            # ── Connection Tuning ────────────────────────────────────────────
            # Streamlit holds long-lived connections — default 60s would time out.
            # 86400 = 24 hours, effectively keeps the connection alive indefinitely.
            proxy_read_timeout 86400;

            # Disable buffering — required for Streamlit's streaming responses.
            # With buffering on, the UI would only update in chunks, not in real time.
            proxy_buffering off;

            # Pass client IP to Streamlit for logging
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
