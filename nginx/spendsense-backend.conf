# =============================================================================
# SpendSense — nginx Reverse Proxy Config: FastAPI Backend
# Commit 1.2: HTTPS Local Setup
#
# PURPOSE : Local development HTTPS only — NOT for production use.
#           Production HTTPS is handled automatically by Railway / Render.
#
# PROXIES : https://localhost:8444  →  http://127.0.0.1:8000 (FastAPI)
#
# NOTE    : No WebSocket headers — FastAPI uses standard HTTP for all endpoints.
#           Swagger UI remains fully accessible at https://localhost:8444/docs
#           ReDoc remains accessible at https://localhost:8444/redoc
#
# USAGE   :
#   Load:   nginx -c /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/spendsense-backend.conf
#   Reload: nginx -s reload
#   Stop:   nginx -s stop
# =============================================================================

# Required — unique pid file so this instance doesn't conflict with the frontend config
pid /tmp/nginx-spendsense-backend.pid;

events {
    worker_connections 64;
}

http {

    server {
        listen      8444 ssl;
        server_name localhost;

        # ── TLS Certificate ──────────────────────────────────────────────────
        # Same cert pair as the frontend — one cert covers both services
        ssl_certificate     /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/certs/spendsense.crt;
        ssl_certificate_key /Users/debashish/Desktop/ai-projects/expenditure-tracker/nginx/certs/spendsense.key;

        # ── TLS Hardening ────────────────────────────────────────────────────
        # Only allow TLSv1.2 and TLSv1.3 — older versions (1.0, 1.1) are insecure
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suite — excludes anonymous (aNULL) and MD5-based ciphers
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── Proxy to FastAPI ─────────────────────────────────────────────────
        location / {
            proxy_pass http://127.0.0.1:8000;

            # ── Standard Proxy Headers ───────────────────────────────────────
            # Pass the original Host header so FastAPI generates correct URLs
            # in responses (e.g. OpenAPI schema server URLs)
            proxy_set_header Host $host;

            # Pass the real client IP — useful for logging and rate limiting (Sprint 5)
            proxy_set_header X-Real-IP $remote_addr;

            # Append to the forwarded-for chain if request passed through other proxies
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Tell FastAPI the original protocol was HTTPS — important for
            # generating correct redirect URLs and enforcing HTTPS-only cookies
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── No WebSocket headers ─────────────────────────────────────────
            # FastAPI uses standard HTTP request/response for all endpoints.
            # WebSocket headers are intentionally omitted here.
        }
    }
}
