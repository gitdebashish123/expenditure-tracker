# ── Wallet Mantra — Railway Deployment Config ──────────────────────────────────
# Defines two services: backend (FastAPI) and frontend (React/Nginx)
# Railway reads this file automatically when connected to the GitHub repo
#
# Docs: https://docs.railway.app/reference/railway-toml
#
# Branch strategy:
#   - Railway deploys from `main` only
#   - All development happens on `develop` or `feature/*` branches
#   - Merge develop → main only when a sprint is fully verified
#
# Local dev:  docker compose up -d
# Production: git push origin main (after merging develop → main)
#
# Streamlit still runs locally alongside React during 2-week validation period:
#   uv run streamlit run frontend/app.py --server.port 8501

[project]
name = "walletMantra"

# ── Backend Service ───────────────────────────────────────────────────────────
[services.backend]
dockerfile = "Dockerfile.backend"

# Run schema migration before each deploy
pre_deploy_command = "uv run python migrate_schema.py"

healthcheck_path = "/health"
healthcheck_timeout = 60

port = 8000

restart_policy_type = "on_failure"
restart_policy_max_retries = 3

# ── Frontend Service (React/Nginx) ────────────────────────────────────────────
# T2.10: replaced Streamlit (port 8501) with React/Nginx (port 80)
# VITE_API_BASE must be set in Railway frontend service environment variables:
#   VITE_API_BASE = https://your-backend.up.railway.app
[services.frontend]
dockerfile = "Dockerfile.frontend"

# Nginx serves on port 80 — no Streamlit health endpoint anymore
healthcheck_path = "/"
healthcheck_timeout = 60

port = 80

restart_policy_type = "on_failure"
restart_policy_max_retries = 3
