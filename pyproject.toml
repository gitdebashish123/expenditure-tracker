[project]
name = "spendsense"
version = "1.0.0"
description = "Natural-language personal expenditure tracker powered by Claude AI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "pyarrow>=18.0.0,<20.0.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "jose>=1.0.0",
    "slowapi>=0.1.9",
    "bleach>=6.3.0",
]

[project.scripts]
spendsense-api = "backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]
